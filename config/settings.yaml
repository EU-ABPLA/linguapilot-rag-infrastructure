llm:
  provider: openai
  model: gpt-4o-mini
  api_key: ""
embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
splitter:
  provider: recursive
  chunk_size: 800
  chunk_overlap: 100
vector_store:
  provider: chroma
  collection: default
retrieval:
  top_k: 5
  use_hybrid: true
rerank:
  enabled: false
  provider: none
  model: ""
evaluation:
  backends: [custom]
  golden_test_set: tests/fixtures/golden_test_set.json
observability:
  enabled: true
  log_file: logs/traces.jsonl
ingestion:
  chunk_refiner:
    use_llm: false
    prompt_path: config/prompts/chunk_refinement.txt
  metadata_enricher:
    use_llm: false
  image_captioner:
    use_vision_llm: false
    prompt_path: config/prompts/image_captioning.txt
