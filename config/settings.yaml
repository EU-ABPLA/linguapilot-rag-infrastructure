llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  api_key: "${LLM_API_KEY}"
  base_url: "https://api.deepseek.com"
  temperature: 0.0
  max_tokens: 4096
embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"
  dimensions: 768
splitter:
  provider: recursive
  chunk_size: 800
  chunk_overlap: 100
vector_store:
  provider: chroma
  collection: default
retrieval:
  top_k: 5
  use_hybrid: true
rerank:
  enabled: true
  provider: none
  model: ""
evaluation:
  backends: [custom]
  golden_test_set: tests/fixtures/golden_test_set.json
observability:
  enabled: true
  log_file: logs/traces.jsonl
ingestion:
  chunk_refiner:
    use_llm: false
    prompt_path: config/prompts/chunk_refinement.txt
  metadata_enricher:
    use_llm: false
  image_captioner:
    use_vision_llm: false
    prompt_path: config/prompts/image_captioning.txt
